### Error Validation Messages ###
error.mail.fail=メール送信に失敗しました。
error.date.format=パラメータ {0} のフォーマットは yyyy/MM/dd HH:mm である必要があります。
error.invalidterm=開始日は終了日以前である必要があります。開始日={0}, 終了日={1}

### Exception Handler Messages ###
error.badRequest=リクエストパラメータが不正、または必須項目が不足しています。
error.upload.maxSize=アップロードファイルが上限サイズを超えています。
error.web.notFound=指定されたURI {0} へのマッピングが見つかりません。

### Database Messages ###
error.dataNotFound=要求されたデータが見つかりません。
error.dataNotFoundOnMaster={1} に {0} のデータが存在しません。
error.userAlreadyRegister=ユーザーID {0} は既に登録されています。
error.userNotRegister=ユーザーIDが存在しません。

### System Messages ###
error.system=予期せぬシステムエラーが発生しました。管理者にお問い合わせください。
error.date.format.system=日付形式の変換に失敗しました。
error.sql.issue=データベース処理中にエラーが発生しました。

### JWT & Auth Messages ###
error.noAccessToken=アクセストークンが存在しません。再度ログインしてください。
error.expiredJWT=トークンの有効期限が切れています。
error.unsupportedJWT=サポートされていないJWT形式です。
error.invalidJWT=無効なJWTです。
error.illegalJWT=トークンが空またはnullです。
error.noRefreshToken=リフレッシュトークンが存在しません。
error.invalidRole=アクセス権限が不足しています。
login.user.failed=ログインに失敗しました。入力内容を確認してください。
