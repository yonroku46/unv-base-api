server:
  address: localhost
  port: 8080
  viewport: 3000

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/unv_base_db?characterEncoding=UTF-8&serverTimezone=Asia/Tokyo
    username: root
    password: admin

security:
  jwt:
    # 開発環境用デフォルトシークレットキー（本番環境では環境変数またはSSMで上書き）
    secret-key: unv-base-api-development-secret-key-must-be-at-least-256-bits-long!!
  oauth2:
    base: http://${server.address}:${server.viewport}

logging:
  level:
    root: INFO
    com.univus.base: DEBUG
    com.univus.base.dao: DEBUG
    org.mybatis: DEBUG
    org.apache.ibatis: DEBUG
    java.sql: DEBUG
