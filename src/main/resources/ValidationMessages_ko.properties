### Error Validation Messages ###
error.mail.fail=이메일 전송에 실패했습니다.
error.date.format=파라미터 {0}의 형식은 yyyy/MM/dd HH:mm 이어야 합니다.
error.invalidterm=시작일은 종료일 이전이어야 합니다. 시작일={0}, 종료일={1}

### Exception Handler Messages ###
error.badRequest=요청 파라미터가 잘못되었거나 필수 항목이 누락되었습니다.
error.upload.maxSize=업로드 파일이 최대 허용 크기를 초과했습니다.
error.web.notFound=지정된 URI {0}에 대한 매핑을 찾을 수 없습니다.

### Database Messages ###
error.dataNotFound=요청한 데이터를 찾을 수 없습니다.
error.dataNotFoundOnMaster={1}에 {0}의 데이터가 존재하지 않습니다.
error.userAlreadyRegister=사용자 ID {0}은(는) 이미 등록되어 있습니다.
error.userNotRegister=사용자 ID가 존재하지 않습니다.

### System Messages ###
error.system=예기치 않은 시스템 오류가 발생했습니다. 관리자에게 문의해주세요.
error.date.format.system=날짜 형식 변환에 실패했습니다.
error.sql.issue=데이터베이스 처리 중 오류가 발생했습니다.

### JWT & Auth Messages ###
error.noAccessToken=액세스 토큰이 존재하지 않습니다. 다시 로그인해주세요.
error.expiredJWT=토큰 유효기간이 만료되었습니다.
error.unsupportedJWT=지원되지 않는 JWT 형식입니다.
error.invalidJWT=유효하지 않은 JWT입니다.
error.illegalJWT=토큰이 비어 있거나 null입니다.
error.noRefreshToken=리프레시 토큰이 존재하지 않습니다.
error.invalidRole=접근 권한이 부족합니다.
login.user.failed=로그인에 실패했습니다. 입력 내용을 확인해주세요.
